<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCORE2SOUND</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="kop">
    <h1>SCORE2SOUND</h1>
    <p>Van bladmuziek naar muziek die je kunt horen en bewerken.</p>
  </header>
  <main class="werkvlak">
    <!-- Elk vlak hoort bij een scherm in js/; de id's niet veranderen. -->
    <section id="inloggen" aria-label="Inloggen"></section>
    <section id="upload" aria-label="Bladmuziek openen">
      <h2>Open bladmuziek</h2>
      <p>Sleep een PDF, scan, foto of MusicXML-bestand hierheen, of kies een bestand.</p>
    </section>
    <section id="projecten" aria-label="Projecten"></section>
    <section id="weergave" aria-label="Partituur"></section>
    <section id="origineel" aria-label="Origineel"></section>
    <section id="corrigeren" aria-label="Noot corrigeren"></section>
    <section id="speler" aria-label="Speler"></section>
    <section id="mixer" aria-label="Partijen"></section>
    <section id="bewerken" aria-label="Partijen bewerken"></section>
    <section id="versies" aria-label="Versies"></section>
    <section id="meldingen" aria-label="Meldingen"></section>
    <section id="export" aria-label="Exporteren"></section>
  </main>
</body>
</html>
