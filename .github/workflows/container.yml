name: Container

on:
  pull_request:
    paths:
      - Dockerfile
      - app/**
      - .github/workflows/container.yml

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag score2sound:test .
      - name: Check Audiveris
        run: docker run --rm score2sound:test sh -c '"$AUDIVERIS" -batch -help'
      - name: Check container endpoints
        run: |
          docker run --detach --name score2sound-test --publish 5175:5175 score2sound:test
          ready=false
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:5175/ > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent --show-error --retry-all-errors --retry 30 --retry-max-time 60 http://localhost:5175/api/projecten > /dev/null
      - name: Show container logs
        if: failure()
        run: docker logs score2sound-test
      - name: Remove test container
        if: always()
        run: docker rm --force score2sound-test >/dev/null 2>&1 || true
