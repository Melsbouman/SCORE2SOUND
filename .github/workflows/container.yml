name: Container

on:
  pull_request:
    paths:
      - Dockerfile
      - app/**
      - .github/workflows/container.yml

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag score2sound:test .
      - name: Check Audiveris
        run: docker run --rm score2sound:test sh -c '"$AUDIVERIS" -batch -help'
      - name: Check container endpoints
        run: |
          docker run --detach --name score2sound-test --publish 5175:5175 score2sound:test
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 --retry-max-time 30 http://localhost:5175/ > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 --retry-max-time 30 http://localhost:5175/api/projecten > /dev/null
      - name: Show container logs
        if: failure()
        run: docker logs score2sound-test
      - name: Remove test container
        if: always()
        run: docker rm --force score2sound-test >/dev/null 2>&1 || true
